name: Build and Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      backend-image: ${{ steps.build-backend.outputs.image }}
      frontend-image: ${{ steps.build-frontend.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: secrets.DOCKER_USERNAME != ''

      - name: Build backend image
        id: build-backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          tags: |
            termone-backend:${{ github.sha }}
            termone-backend:latest
          cache-from: type=registry,ref=termone-backend:buildcache
          cache-to: type=registry,ref=termone-backend:buildcache,mode=max
          outputs: type=docker

      - name: Build frontend image
        id: build-frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: false
          tags: |
            termone-frontend:${{ github.sha }}
            termone-frontend:latest
          cache-from: type=registry,ref=termone-frontend:buildcache
          cache-to: type=registry,ref=termone-frontend:buildcache,mode=max
          outputs: type=docker

  test:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: termone_user
          POSTGRES_PASSWORD: termone_password
          POSTGRES_DB: termone_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://termone_user:termone_password@localhost:5432/termone_db
          ENCRYPTION_MASTER_KEY: test-key-32-bytes-minimum-12345
          JWT_SECRET: test-secret-minimum-32-characters
        run: pytest tests/ -v

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "Deployment to production would occur here"
          echo "Tag: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"

      # Add your deployment steps here
      # Examples:
      # - Push to Docker registry
      # - Deploy to Kubernetes
      # - Deploy to cloud platform (AWS, GCP, Azure, etc.)
      # - Send notifications

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
